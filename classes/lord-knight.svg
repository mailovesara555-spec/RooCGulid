<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lkBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="lkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#lkBg)" stroke="url(#lkGold)" stroke-width="4" filter="url(#lkShadow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <!-- Crossed Greatswords -->
  <g transform="translate(50,50) rotate(45) translate(-50,-50)" filter="url(#lkShadow)">
    <rect x="47" y="18" width="6" height="52" rx="2" fill="url(#lkBlade)" stroke="#334155" stroke-width="1"/>
    <polygon points="50,12 46,19 54,19" fill="#f8fafc"/>
    <path d="M50,18 L50,68" stroke="#64748b" stroke-width="1.5"/>
    <rect x="36" y="70" width="28" height="5" rx="2" fill="url(#lkGold)" stroke="#854d0e" stroke-width="0.8"/>
    <rect x="48" y="75" width="4" height="12" rx="1" fill="#78350f"/>
    <circle cx="50" cy="89" r="3.5" fill="url(#lkGold)" stroke="#854d0e" stroke-width="0.8"/>
  </g>
  <g transform="translate(50,50) rotate(-45) translate(-50,-50)" filter="url(#lkShadow)">
    <rect x="47" y="18" width="6" height="52" rx="2" fill="url(#lkBlade)" stroke="#334155" stroke-width="1"/>
    <polygon points="50,12 46,19 54,19" fill="#f8fafc"/>
    <path d="M50,18 L50,68" stroke="#64748b" stroke-width="1.5"/>
    <rect x="36" y="70" width="28" height="5" rx="2" fill="url(#lkGold)" stroke="#854d0e" stroke-width="0.8"/>
    <rect x="48" y="75" width="4" height="12" rx="1" fill="#78350f"/>
    <circle cx="50" cy="89" r="3.5" fill="url(#lkGold)" stroke="#854d0e" stroke-width="0.8"/>
  </g>
  <!-- Knight Visor / Crest Center -->
  <path d="M42,44 L50,38 L58,44 L58,54 L50,60 L42,54 Z" fill="url(#lkGold)" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="50" cy="49" r="3" fill="#ef4444"/>
</svg>