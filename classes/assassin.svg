<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="sinBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sinPoison" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#sinBg)" stroke="url(#sinPoison)" stroke-width="4"/>
  <!-- Cross Katars -->
  <g transform="translate(50,50) rotate(35) translate(-50,-50)">
    <!-- Triple Blade Katar -->
    <path d="M47,15 L50,10 L53,15 L53,60 L47,60 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <path d="M41,25 L44,20 L47,25 L47,55 L41,55 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <path d="M53,25 L56,20 L59,25 L59,55 L53,55 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <!-- Handle -->
    <rect x="36" y="58" width="28" height="6" rx="2" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="42" y="64" width="16" height="14" rx="2" fill="#3f3f46" stroke="#09090b"/>
  </g>
  <g transform="translate(50,50) rotate(-35) translate(-50,-50)">
    <path d="M47,15 L50,10 L53,15 L53,60 L47,60 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <path d="M41,25 L44,20 L47,25 L47,55 L41,55 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <path d="M53,25 L56,20 L59,25 L59,55 L53,55 Z" fill="url(#sinBlade)" stroke="#09090b" stroke-width="1"/>
    <rect x="36" y="58" width="28" height="6" rx="2" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="42" y="64" width="16" height="14" rx="2" fill="#3f3f46" stroke="#09090b"/>
  </g>
  <!-- Poison Glow / Eye of Cross -->
  <polygon points="50,42 56,50 50,58 44,50" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
</svg>