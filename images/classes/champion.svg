<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="champBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="champGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#champBg)" stroke="url(#champGold)" stroke-width="4"/>
  <!-- Chakra Energy Ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Steel Gauntlet Fist -->
  <g transform="translate(25, 25)">
    <!-- Palm / Back of hand -->
    <path d="M12,24 C10,18 16,12 24,10 C32,8 40,14 42,22 L40,36 C38,44 26,46 16,42 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <!-- Knuckle Plates -->
    <rect x="14" y="14" width="7" height="12" rx="2" fill="url(#champGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="22" y="12" width="7" height="14" rx="2" fill="url(#champGold)" stroke="#78350f" stroke-width="1"/>
    <rect x="30" y="14" width="7" height="12" rx="2" fill="url(#champGold)" stroke="#78350f" stroke-width="1"/>
    <!-- Wrist Guard -->
    <path d="M8,34 L42,34 L40,46 L10,46 Z" fill="#1e293b" stroke="url(#champGold)" stroke-width="1.5"/>
    <circle cx="25" cy="40" r="3" fill="#ef4444"/>
  </g>
  <!-- Qi Flame bursts -->
  <path d="M50,14 C54,20 46,24 50,28" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M18,45 C24,47 22,55 26,58" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M82,45 C76,47 78,55 74,58" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>