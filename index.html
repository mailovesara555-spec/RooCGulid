<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Wendell GUILD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f5f3ff;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(244, 114, 182, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(253, 186, 116, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #ede9fe 0%, #fce7f3 50%, #fef3c7 100%);
            color: #1e1b4b;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('images/pastel_bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .roo-card { 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.95); 
            box-shadow: 0 20px 45px -10px rgba(124, 58, 237, 0.15), 0 8px 20px rgba(244, 114, 182, 0.1); 
        }
        .discord-button { 
            background: linear-gradient(135deg, #5865F2 0%, #7c3aed 100%); 
            box-shadow: 0 6px 18px rgba(88, 101, 242, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }
        .discord-button:hover { 
            background: linear-gradient(135deg, #4752C4 0%, #6d28d9 100%); 
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.5); 
            transform: translateY(-1px); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="roo-card w-full max-w-md rounded-[2.5rem] p-10 relative z-10 text-center animate-[fadeIn_0.4s_ease-out]">
        
        <div class="relative inline-block mb-6 group">
            <div class="absolute -inset-1.5 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 rounded-3xl blur-md opacity-70 group-hover:opacity-100 transition duration-300"></div>
            <img src="images/guild_icon.jpg" alt="Wendell Guild" class="relative w-24 h-24 rounded-2xl mx-auto object-cover shadow-lg border-2 border-white group-hover:scale-105 transition-transform duration-300">
        </div>

        <h1 class="text-2xl sm:text-3xl font-black tracking-tight mb-2 flex items-center justify-center gap-1.5">
            <span class="text-indigo-950">Wendell</span>
            <span class="bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 bg-clip-text text-transparent font-black text-2xl">Guild</span>
        </h1>
        <p class="text-slate-600 mb-8 text-sm font-semibold">ระบบจัดการกิลด์ Ragnarok Origin</p>

        <!-- แสดง Error หากมี -->
        <div id="error-message" class="hidden mb-6 p-4 bg-rose-50 border border-rose-200 rounded-2xl text-rose-700 text-sm font-medium">
        </div>

        <div class="space-y-4">
            <!-- Link ไปยัง /auth/discord ของ Server -->
            <a href="/auth/discord" class="discord-button w-full text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 transition-all cursor-pointer">
                <svg class="w-5 h-5 drop-shadow" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
                </svg>
                เข้าสู่ระบบด้วย Discord
            </a>
        </div>
        
        <p class="text-xs text-purple-800/80 font-medium mt-8">
            เฉพาะสมาชิกกิลด์ Wendell ที่ได้รับอนุญาตเท่านั้น
        </p>
    </div>

    <script>
        // Check for error or logout in URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const isLogout = urlParams.get('logout') === 'true';

        if (isLogout) {
            localStorage.removeItem('rooc_auth_token');
            localStorage.removeItem('rooc_discord_user');
            localStorage.removeItem('rooc_user');
            sessionStorage.clear();
        }

        const discordUserParam = urlParams.get('discord_user');
        const displayNameParam = urlParams.get('display_name');

        if (error === 'member_only') {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = '🔒 <b>หน้าดาวน์โหลด Romarco อนุญาตเฉพาะสมาชิกกิลด์เท่านั้น</b><p class="text-xs text-stone-600 mt-1 font-normal">กรุณาเข้าสู่ระบบด้วย Discord ก่อนเพื่อเข้าใช้งานครับ</p>';
            errorDiv.classList.remove('hidden');
        } else if (error === 'not_allowed') {
            const errorDiv = document.getElementById('error-message');
            let userDetail = discordUserParam ? `<br><div class="mt-2 p-2 bg-amber-100/80 border border-amber-300 rounded-lg text-xs font-bold text-amber-950">บัญชีที่ใช้ล็อกอิน: <span class="text-red-700">${discordUserParam}</span>${displayNameParam && displayNameParam.toLowerCase() !== discordUserParam.toLowerCase() ? ' (' + displayNameParam + ')' : ''}</div>` : '';
            errorDiv.innerHTML = `❌ บัญชี Discord ของคุณไม่ได้รับอนุญาตให้เข้าถึงระบบนี้${userDetail}<p class="text-xs text-stone-600 mt-2 font-normal">กรุณาแจ้ง Admin (daffodil2693) หรือหัวหน้ากิลด์ให้เพิ่มชื่อนี้ในระบบ Whitelist ครับ</p>`;
            errorDiv.classList.remove('hidden');
        } else if (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = '❌ เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
